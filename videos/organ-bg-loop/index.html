<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Organ Donor Ambient Motion Loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --void: #030712;
        --obsidian: #061024;
        --gold-primary: #c9a23b;
        --gold-bright: #f4d381;
        --crimson: #e63946;
        --cyan: #38bdf8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--void);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 60% 45%, #0c2044 0%, #050e1f 50%, #030712 100%);
        overflow: hidden;
      }
      .glow-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.45;
        mix-blend-mode: screen;
      }
      #orb1 {
        width: 800px;
        height: 800px;
        left: 20%;
        top: 15%;
        background: radial-gradient(circle, rgba(201, 162, 59, 0.4) 0%, rgba(12, 32, 68, 0.1) 60%, transparent 75%);
      }
      #orb2 {
        width: 700px;
        height: 700px;
        right: 15%;
        bottom: 10%;
        background: radial-gradient(circle, rgba(230, 57, 70, 0.3) 0%, rgba(56, 189, 248, 0.15) 50%, transparent 75%);
      }
      canvas {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(3, 7, 18, 0.85) 90%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="orb1" class="glow-orb"></div>
        <div id="orb2" class="glow-orb"></div>
        <canvas id="particleCanvas" width="1920" height="1080"></canvas>
        <div class="vignette"></div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("particleCanvas");
      const ctx = canvas.getContext("2d");

      // Particle system for seamless 6-second loop
      const DURATION = 6;
      const PARTICLE_COUNT = 90;
      const particles = [];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x0: Math.random() * 1920,
          y0: Math.random() * 1080,
          radius: Math.random() * 4 + 1.5,
          color: Math.random() > 0.4 ? "rgba(244, 211, 129, " : (Math.random() > 0.5 ? "rgba(230, 57, 70, " : "rgba(56, 189, 248, "),
          speedX: (Math.random() - 0.5) * 120,
          speedY: -Math.random() * 180 - 40,
          pulseSpeed: Math.random() * 3 + 1,
          phase: Math.random() * Math.PI * 2
        });
      }

      function renderFrame(time) {
        ctx.clearRect(0, 0, 1920, 1080);

        // Cardiac pulse wave
        const pulse = (Math.sin((time / DURATION) * Math.PI * 4) + 1) / 2;

        ctx.strokeStyle = `rgba(201, 162, 59, ${0.08 + pulse * 0.12})`;
        ctx.lineWidth = 2 + pulse * 2;
        ctx.beginPath();
        ctx.arc(960, 540, 280 + pulse * 80, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = `rgba(230, 57, 70, ${0.06 + pulse * 0.08})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(960, 540, 420 + pulse * 110, 0, Math.PI * 2);
        ctx.stroke();

        // Particles
        const tNorm = (time % DURATION) / DURATION;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const x = (p.x0 + p.speedX * (time % DURATION) + 1920) % 1920;
          const y = (p.y0 + p.speedY * (time % DURATION) + 1080) % 1080;
          const alpha = 0.3 + 0.5 * Math.sin(tNorm * Math.PI * 2 * p.pulseSpeed + p.phase);

          ctx.fillStyle = p.color + Math.max(0, alpha) + ")";
          ctx.beginPath();
          ctx.arc(x, y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // GSAP Timeline for HyperFrames
      const timeline = gsap.timeline({ repeat: -1 });
      const animState = { time: 0 };

      gsap.to("#orb1", {
        x: 120,
        y: -80,
        duration: 3,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      gsap.to("#orb2", {
        x: -140,
        y: 90,
        duration: 3,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut"
      });

      gsap.to(animState, {
        time: DURATION,
        duration: DURATION,
        ease: "none",
        repeat: -1,
        onUpdate: function () {
          renderFrame(animState.time);
        }
      });
    </script>
  </body>
</html>
